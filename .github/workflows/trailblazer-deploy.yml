# Deploys TrailBlazer to EC2 (Server B) whenever master is pushed.
# Can also be started by hand from the repo's Actions tab ("Run workflow").
#
# No keys or passwords are stored for this. GitHub gives each run a short-lived
# OIDC token; AWS swaps it for a temporary role (github-deploy-trailblazer) that may only
# upload to the deploy bucket and run commands on Server B.
#
# Required repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN   ARN of the github-deploy-trailblazer role
#   EC2_INSTANCE_ID       Server B's instance ID
#
# The app's settings (database, keys) are NOT here. They live in
# /home/ec2-user/trailblazer.env on the server.
# Server B runs 8:30 AM to 6 PM Central on weekdays; a deploy outside those hours will time out.
name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-trailblazer
  cancel-in-progress: false

permissions:
  id-token: write   # lets the run request its OIDC token
  contents: read    # lets actions/checkout read the code

env:
  AWS_REGION: us-east-1
  BUCKET: nickowen-deploy-artifacts

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Package the release
        run: |
          tar czf /tmp/release.tgz --exclude=.git --exclude=.github --exclude=node_modules .
          mv /tmp/release.tgz release.tgz

      # Swap GitHub's OIDC token for temporary AWS credentials (pinned to a commit, as GitHub's docs show).
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Each commit gets its own folder, so nothing is ever overwritten.
      - name: Upload the release and install script to S3
        run: |
          PREFIX="trailblazer/$GITHUB_SHA"
          aws s3 cp release.tgz       "s3://$BUCKET/$PREFIX/release.tgz" --only-show-errors
          aws s3 cp deploy/install.sh "s3://$BUCKET/$PREFIX/install.sh"  --only-show-errors
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"

      # Run Command runs as root; the install runs as ec2-user in a login shell (nvm's Node, the app folders).
      - name: Tell Server B to install it (SSM Run Command)
        run: |
          RELEASE="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          PARAMS=$(jq -n \
            --arg get "aws s3 cp s3://$BUCKET/$PREFIX/install.sh /tmp/trailblazer-install.sh --only-show-errors && chmod 755 /tmp/trailblazer-install.sh" \
            --arg run "sudo -iu ec2-user bash -l /tmp/trailblazer-install.sh $BUCKET $PREFIX/release.tgz $RELEASE" \
            '{commands: [$get, $run]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy trailblazer ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"

      - name: Wait for the result
        run: |
          STATUS="Pending"
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "Status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          case "$STATUS" in
            Success) echo "Deploy succeeded." ;;
            Failed)  echo "::error::The install script failed on Server B. See its output above."; exit 1 ;;
            Pending|InProgress|Delayed|Undeliverable|TimedOut|DeliveryTimedOut)
                     echo "::error::Server B never ran the command (status: $STATUS). Is it running? It's scheduled 8:30 AM to 6 PM Central, weekdays."; exit 1 ;;
            *)       echo "::error::Deploy did not succeed (status: $STATUS)."; exit 1 ;;
          esac
